# The judgement half of QA: whenever app code lands on main (i.e. a PR from a
# Claude Code session gets merged), Claude runs the /qa sweep (see
# .claude/skills/qa/SKILL.md) over just what that merge changed, and opens a
# "QA sweep" PR if it fixed a P0/P1 bug. No edits, no run, no cost. The
# deterministic half (lint, types, tests, build) is ci.yml on every PR plus
# nightly.yml. Uses the ANTHROPIC_API_KEY repo secret — cents to a few
# dollars per run depending on the size of the change.
name: QA agent

on:
  push:
    branches: [main]
    # Docs, tests and CI config alone don't need a sweep.
    paths:
      - "src/**"
      - "supabase/**"
      - "scripts/**"
      - "package.json"
  workflow_dispatch:
    inputs:
      base:
        description: "Review changes since this commit (blank = the last 7 days)"
        required: false

jobs:
  # claude-code-action refuses to start from a `push` event ("Unsupported
  # event type: push"), but runs fine from workflow_dispatch — so a merge
  # just presses "Run workflow" on itself, passing along what changed.
  # (GITHUB_TOKEN may trigger workflow_dispatch; it's the one exception to
  # "workflows can't start workflows".)
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run qa-agent.yml --repo "$GITHUB_REPOSITORY" --ref main -f base="$BASE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.before }}

  sweep:
    if: github.event_name == 'workflow_dispatch'
    # No cancel-in-progress: each run reviews only its own merge's changes,
    # so cancelling an older run would leave that merge unreviewed.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: What changed
        id: range
        run: |
          # A merge passes the commit before it; a manual run looks back a week.
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            echo "range=$BASE..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "range=$(git rev-list -1 --before='7 days ago' HEAD || git rev-list --max-parents=0 HEAD)..HEAD" >> "$GITHUB_OUTPUT"
          fi
        env:
          BASE: ${{ inputs.base }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Passed explicitly: scheduled runs can't do the GitHub App token
          # exchange (anthropics/claude-code-action#814).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Put Claude's final QA report (with "Your next steps") on the
          # run's Summary page — the log hides Claude's output by default.
          display_report: true
          claude_args: |
            --model claude-sonnet-5
            --max-turns 120
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,Agent,Task,Skill,TodoWrite"
          prompt: |
            REPO: ${{ github.repository }} — you are on a fresh checkout of main with dependencies installed.
            Run That Friend's QA sweep on what just landed on main.

            1. Read .claude/skills/qa/SKILL.md and follow its `sweep` mode,
               scoped to this change:
               - Changed files: `git diff --name-only ${{ steps.range.outputs.range }}`
                 (read the diff too). Audit those plus anything the skill marks
                 as touched by them; skip unrelated areas.
               - Always run `npm run qa` and `npm run build`.
            2. Never run seed scripts or e2e against production, and never send
               real SMS. There is no .env.local here; that's expected.
            3. If you fix P0 or P1 bugs:
               - Add a regression test for each fix.
               - Update docs/qa/KNOWN_ISSUES.md with anything found but not fixed.
               - Commit to a new branch named `qa/sweep-$(date -u +%F-%H%M)` and push it.
               - Open a PR with
                 `gh pr create --base main --title "QA sweep <date>" --body-file <report.md>`,
                 where the body is the skill's QA report.
               - Never merge anything.
            4. If there's nothing worth fixing, don't open a PR. Print the QA
               report as your final message, and end with one line: ship-safe or not.
            5. Every report, including the PR body, ends with the skill's
               "Your next steps" section: a plain-language, numbered checklist
               for the owner.
