# Runs the browser suite against each Vercel preview deploy once it's live.
# Public specs always run; persona specs run only if the preview points at
# the staging Supabase project and QA_SEED_JSON holds `npm run qa:seed` output.
name: E2E (preview)

on:
  deployment_status:

jobs:
  e2e:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment != 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Restore seeded QA ids
        if: env.QA_SEED_JSON != ''
        run: echo "$QA_SEED_JSON" > qa/.seed.json
        env:
          QA_SEED_JSON: ${{ secrets.QA_SEED_JSON }}
      - run: npm run test:e2e
        env:
          QA_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: qa/reports/
          retention-days: 14
