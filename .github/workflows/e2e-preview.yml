# Runs the browser suite against each Vercel preview deploy once it's live.
# Public specs always run; persona specs run only if the preview points at
# the staging Supabase project and QA_SEED_JSON holds `npm run qa:seed` output.
name: E2E (preview)

on:
  deployment_status:

jobs:
  e2e:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment != 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      # Previews behind Vercel Deployment Protection bounce every request to
      # vercel.com/login unless the bypass secret is set. Testing that login
      # page tells us nothing about the app, so say so loudly and stop.
      - name: Check the preview is reachable
        id: reach
        env:
          URL: ${{ github.event.deployment_status.environment_url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          read -r code final < <(curl -s -o /dev/null -L -w '%{http_code} %{url_effective}' ${BYPASS:+-H "x-vercel-protection-bypass: $BYPASS"} "$URL/planner/login" || true)
          echo "preview answered $code at $final"
          if [[ "$code" != 2* || "$final" != "$URL"* ]]; then
            echo "::warning title=E2E skipped::The preview answered $code at $final instead of the app — usually Vercel Deployment Protection. Add the VERCEL_AUTOMATION_BYPASS_SECRET repo secret (Vercel → Project → Settings → Deployment Protection → Protection Bypass for Automation) to run e2e on previews."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.reach.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.reach.outputs.ok == 'true'
        run: npm ci
      - if: steps.reach.outputs.ok == 'true'
        run: npx playwright install --with-deps chromium
      - name: Restore seeded QA ids
        if: steps.reach.outputs.ok == 'true' && env.QA_SEED_JSON != ''
        run: echo "$QA_SEED_JSON" > qa/.seed.json
        env:
          QA_SEED_JSON: ${{ secrets.QA_SEED_JSON }}
      - if: steps.reach.outputs.ok == 'true'
        run: npm run test:e2e
        env:
          QA_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.reach.outputs.ok == 'true'
        with:
          name: playwright-report
          path: qa/reports/
          retention-days: 14
